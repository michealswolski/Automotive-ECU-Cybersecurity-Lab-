# Automotive ECU Cybersecurity Lab — repository manifest.
#
# This file is the single source of truth for project metadata. The README
# tables, the docs status pages and the landing site are all generated from it
# by `tools/labctl`, so a project's summary, status, build order and skill
# coverage are written down exactly once.
#
# Regenerate everything downstream with:  make render
# Check that nothing has drifted with:    make check

[lab]
name = "Automotive ECU Cybersecurity Lab"
owner = "michealswolski"
repo = "Automotive-ECU-Cybersecurity-Lab-"
tagline = "Six buildable projects across the automotive product-security lifecycle."

# ---------------------------------------------------------------------------
# Projects
#
# status:
#   specified   — spec, build plan and acceptance criteria are written; no code
#   building    — implementation under way, acceptance criteria not all met
#   built       — every acceptance criterion in ACCEPTANCE.md is checked off
#
# Nothing here is allowed to claim `built` while ACCEPTANCE.md still has
# unchecked boxes; `labctl validate` enforces that.
# ---------------------------------------------------------------------------

[[project]]
id = "secure-boot-chain-simulator"
number = 1
order = 1
title = "Secure Boot Chain Simulator"
status = "specified"
language = "Python"
effort = "M"
summary = """
A simulated multi-stage boot chain — BootROM to bootloader to application — \
where each stage cryptographically verifies the next before transferring \
control, over a hardware root of trust in OTP fuses and an HSM that never \
releases a private key."""
centerpiece = """
An image carrying a valid signature from the legitimate signing key that the \
chain still refuses to boot, because its security version number sits behind \
the monotonic counter."""
covers = [
  "secure-boot",
  "chain-of-trust",
  "hsm-root-of-trust",
  "anti-rollback",
  "measured-boot",
  "pki",
  "ecc-signatures",
  "audit-logging",
]
standards = [
  "sae-j3101",
  "nist-sp-800-193",
  "nist-sp-800-208",
  "cnsa-2-0",
  "fips-204",
  "un-r156",
  "iso-24089",
]
consumes = []
provides = []

[[project]]
id = "can-secoc-demo"
number = 2
order = 2
title = "CAN Bus SecOC Demo"
status = "specified"
language = "Python"
effort = "M"
summary = """
An AUTOSAR Secure Onboard Communication implementation over a virtual CAN bus: \
AES-128 CMAC authenticators, the standard profiles with truncated MAC and \
truncated freshness value, receiver-side freshness reconstruction with an \
acceptance window, and resynchronisation."""
centerpiece = """
The same replay attack run twice. Unprotected, the receiver actuates on a \
stale brake command. SecOC-protected, the identical bytes are rejected, with \
the freshness window that was searched printed on screen."""
covers = [
  "can-bus",
  "autosar-secoc",
  "cmac-hmac",
  "aes",
  "replay-protection",
  "freshness-management",
]
standards = [
  "autosar-secoc",
  "rfc-4493",
  "nist-sp-800-38b",
  "iso-11898-1",
]
consumes = ["can-secoc-demo:mac-keys"]
provides = ["can-secoc-demo:authenticator"]

[[project]]
id = "ecu-key-lifecycle"
number = 3
order = 3
title = "ECU Key Lifecycle Manager"
status = "specified"
language = "Python"
effort = "L"
summary = """
The complete cryptographic key lifecycle for a simulated ECU fleet: generation \
in a backend HSM, HKDF derivation with per-generation domain separation, a \
challenge-response provisioning ceremony bound to a single ECU, fleet rotation \
with an overlap window, signed revocation lists, and a hash-chained audit log \
over every transition."""
centerpiece = """
Tampering with one byte of the audit log live and having the tool name the \
exact sequence number that broke the chain."""
covers = [
  "key-management",
  "key-derivation",
  "provisioning",
  "key-rotation",
  "revocation",
  "cryptoperiods",
  "audit-logging",
  "pki",
]
standards = [
  "nist-sp-800-57-1",
  "nist-sp-800-130",
  "rfc-9162",
  "un-r156",
  "iso-24089",
]
consumes = []
provides = ["can-secoc-demo:mac-keys"]

[[project]]
id = "tara-workbench"
number = 4
order = 4
title = "ISO/SAE 21434 TARA Workbench"
status = "specified"
language = "Python"
effort = "L"
summary = """
The Clause 15 TARA workflow run as version-controlled structured data rather \
than a spreadsheet — item definition through risk treatment, with computed \
risk determination, a thirteen-rule linter, and bidirectional traceability \
from any requirement back to the asset it protects."""
centerpiece = """
A complete worked TARA for an OTA-capable telematics gateway ECU, committed to \
the repo, passing its own linter in CI, with requirements that trace to test \
cases in the other projects."""
covers = [
  "iso-21434",
  "tara",
  "threat-modeling",
  "attack-feasibility",
  "risk-assessment",
  "security-requirements",
  "traceability",
  "un-r155",
]
standards = [
  "iso-sae-21434",
  "iso-sae-8475",
  "un-r155",
]
consumes = []
provides = ["tara-workbench:requirements"]

[[project]]
id = "ivn-security-lab"
number = 5
order = 5
title = "In-Vehicle Network Security Lab"
status = "specified"
language = "Python"
effort = "L"
summary = """
A simulated vehicle network spanning three protocols — LIN sub-bus, CAN-FD \
backbone, and Automotive Ethernet carrying SOME/IP-SD and DoIP — joined by a \
gateway ECU with a zone-based firewall, rate limiting, a diagnostic firewall \
and a threshold anomaly detector."""
centerpiece = """
The pivot: compromise a door module on the LIN bus and try to reach the brake \
ECU. Without zone policy you get all the way. With it you stop at the gateway."""
covers = [
  "lin",
  "can-fd",
  "automotive-ethernet",
  "someip",
  "doip",
  "uds",
  "iso-tp",
  "network-segmentation",
  "anomaly-detection",
]
standards = [
  "iso-11898-1",
  "iso-15765-2",
  "iso-14229-1",
  "iso-13400-2",
  "lin-2-2a",
  "ieee-802-1ae",
  "autosar-secoc",
]
consumes = ["can-secoc-demo:authenticator", "tara-workbench:requirements"]
provides = []

[[project]]
id = "ecu-firmware-validation"
number = 6
order = 6
title = "ECU Firmware Security Validation Pipeline"
status = "specified"
language = "C + Python"
effort = "XL"
summary = """
A FreeRTOS application in C on an emulated ARM Cortex-M running a UDS \
diagnostic server behind an ISO-TP reassembler, with eight deliberately \
planted and documented vulnerabilities — wrapped in static analysis, \
sanitizers, coverage-guided fuzzing, SBOM generation and CVE scanning."""
centerpiece = """
The tool-comparison matrix: every planted bug against every tool, found or \
missed, with time-to-first-crash for the fuzzer. One vulnerability is chosen \
precisely because no automated tool catches it."""
covers = [
  "embedded-c",
  "rtos",
  "static-analysis",
  "dynamic-analysis",
  "fuzzing",
  "sbom",
  "cve-scanning",
  "test-traceability",
  "uds",
  "iso-tp",
]
standards = [
  "iso-sae-21434",
  "iso-14229-1",
  "iso-15765-2",
  "misra-c-2012",
  "cert-c",
  "cyclonedx",
  "spdx",
  "eu-cra",
]
consumes = ["tara-workbench:requirements"]
provides = []

