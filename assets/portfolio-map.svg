<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-label="Portfolio map. Four bands: analysis, ECU, network, key material. The TARA workbench emits requirement identifiers the projects below trace their tests to; the SecOC authenticator is reused as the in-vehicle network gateway's enforcement point; the key lifecycle manager provisions the MAC keys SecOC consumes.">
  <title>How the six projects compose</title>
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#050B16"/><stop offset="52%" stop-color="#0A1526"/><stop offset="100%" stop-color="#0F1F35"/></linearGradient>
    <linearGradient id="mTitle" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#67E8F9"/><stop offset="48%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#34D399"/><animate attributeName="x1" values="-40%;60%;-40%" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="60%;160%;60%" dur="9s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="mEdge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/><stop offset="50%" stop-color="#3B82F6" stop-opacity="0.45"/><stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/></linearGradient>
    <linearGradient id="mRule" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#34D399" stop-opacity="0"/></linearGradient>
    <linearGradient id="mScan" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#67E8F9" stop-opacity="0"/><stop offset="50%" stop-color="#67E8F9" stop-opacity="0.40"/><stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/></linearGradient>
    <radialGradient id="mOrbC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22D3EE" stop-opacity="0.50"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="mOrbG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#34D399" stop-opacity="0.50"/><stop offset="100%" stop-color="#34D399" stop-opacity="0"/></radialGradient>
    <radialGradient id="mOrbB" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3B82F6" stop-opacity="0.50"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <pattern id="mGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#3B82F6" stroke-opacity="0.075" stroke-width="1"/></pattern>
    <filter id="mGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="mBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="mCard"><rect width="1280" height="700" rx="22"/></clipPath>
  </defs>
  <style>
    .flow{animation:flow 3.4s cubic-bezier(.5,0,.5,1) infinite}
    .grid-pan{animation:gridPan 26s linear infinite}
    @keyframes flow{0%{opacity:0;offset-distance:0%}12%{opacity:.95}88%{opacity:.95}100%{opacity:0;offset-distance:100%}}
    @keyframes gridPan{to{transform:translate(-40px,-40px)}}
    @media (prefers-reduced-motion: reduce){.flow,.grid-pan{animation:none}}
  </style>
  <g clip-path="url(#mCard)">
    <rect width="1280" height="700" fill="url(#mBg)"/>
    <g class="grid-pan"><rect x="-40" y="-40" width="1360" height="780" fill="url(#mGrid)"/></g>
    <g filter="url(#mBlur)">
      <circle cx="200" cy="110" r="150" fill="url(#mOrbB)"/>
      <circle cx="1090" cy="600" r="170" fill="url(#mOrbG)"/>
    </g>

    <text x="40" y="46" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#E2E8F0">How the six projects compose</text>
    <text x="40" y="72" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#94A3B8">Every arrow is a hand-off the build specs actually define — analysis down into requirements, key material up into the protocol that consumes it.</text>

    <text x="40" y="112" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="3" fill="#64748B">ANALYSIS</text>
    <g>
      <rect x="40" y="124" width="1200" height="86" rx="13" fill="#0B1526" fill-opacity="0.72" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.3"/>
      <rect x="40" y="124" width="1200" height="4" rx="2" fill="#FBBF24"/>
      <text x="58" y="150" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.8" fill="#FBBF24">PROJECT 04</text>
      <text x="58" y="170" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">ISO/SAE 21434 TARA Workbench</text>
      <text x="58" y="186" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">item definition → assets &amp; damage scenarios → threat scenarios → attack feasibility → risk → cybersecurity goals &amp; requirements</text>
    </g>

    <g>
      <path d="M320 210 V258" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 4"/>
      <path d="M315 251 L320 258 L325 251" fill="none" stroke="#FBBF24" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round"/>
      <circle class="flow" cx="0" cy="0" r="3" fill="#FBBF24" opacity="0" style="offset-path:path('M320 210 V258');offset-rotate:0deg;animation-delay:0.0s"/>
      <text x="332" y="238.0" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" fill="#64748B">REQ-*</text>
    </g>
    <g>
      <path d="M960 210 V258" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 4"/>
      <path d="M955 251 L960 258 L965 251" fill="none" stroke="#FBBF24" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round"/>
      <circle class="flow" cx="0" cy="0" r="3" fill="#FBBF24" opacity="0" style="offset-path:path('M960 210 V258');offset-rotate:0deg;animation-delay:0.6s"/>
      <text x="972" y="238.0" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" fill="#64748B">REQ-*</text>
    </g>

    <text x="40" y="252" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="3" fill="#64748B">ECU</text>
    <g>
      <rect x="40" y="264" width="560" height="132" rx="13" fill="#0B1526" fill-opacity="0.72" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.3"/>
      <rect x="40" y="264" width="560" height="4" rx="2" fill="#3B82F6"/>
      <text x="58" y="290" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.8" fill="#3B82F6">PROJECT 01</text>
      <text x="58" y="310" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">Secure Boot Chain Simulator</text>
      <text x="58" y="326" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">BootROM → SBL → application, each verifying the next</text>
      <text x="58" y="343" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">OTP root of trust · monotonic anti-rollback · measured boot</text>
      <text x="58" y="360" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">valid signature, still refused: security version behind the counter</text>
    </g>
    <g>
      <rect x="680" y="264" width="560" height="132" rx="13" fill="#0B1526" fill-opacity="0.72" stroke="#F87171" stroke-opacity="0.45" stroke-width="1.3"/>
      <rect x="680" y="264" width="560" height="4" rx="2" fill="#F87171"/>
      <text x="698" y="290" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.8" fill="#F87171">PROJECT 06</text>
      <text x="698" y="310" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">ECU Firmware Validation Pipeline</text>
      <text x="698" y="326" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">FreeRTOS + UDS/ISO-TP in C on an emulated Cortex-M</text>
      <text x="698" y="343" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">8 planted CWEs vs static analysis, sanitizers, fuzzing, SBOM</text>
      <text x="698" y="360" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">the tool-comparison matrix — including what nothing caught</text>
    </g>

    <text x="40" y="442" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="3" fill="#64748B">NETWORK</text>
    <g>
      <rect x="40" y="454" width="560" height="132" rx="13" fill="#0B1526" fill-opacity="0.72" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.3"/>
      <rect x="40" y="454" width="560" height="4" rx="2" fill="#34D399"/>
      <text x="58" y="480" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.8" fill="#34D399">PROJECT 05</text>
      <text x="58" y="500" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">In-Vehicle Network Security Lab</text>
      <text x="58" y="516" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">LIN sub-bus · CAN-FD backbone · Automotive Ethernet</text>
      <text x="58" y="533" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">zone firewall · routing · diagnostic filter · anomaly detector</text>
      <text x="58" y="550" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">10 attacks, each run permissive vs hardened</text>
    </g>
    <g>
      <rect x="680" y="454" width="560" height="132" rx="13" fill="#0B1526" fill-opacity="0.72" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.3"/>
      <rect x="680" y="454" width="560" height="4" rx="2" fill="#22D3EE"/>
      <text x="698" y="480" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.8" fill="#22D3EE">PROJECT 02</text>
      <text x="698" y="500" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">CAN Bus SecOC Demo</text>
      <text x="698" y="516" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">AES-128 CMAC · truncated MAC · truncated freshness value</text>
      <text x="698" y="533" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">receiver-side freshness reconstruction + resynchronisation</text>
      <text x="698" y="550" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">the same replay: accepted unprotected, rejected under SecOC</text>
    </g>
    <g>
      <path d="M676 520 H604" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 4"/>
      <path d="M611 515 L604 520 L611 525" fill="none" stroke="#22D3EE" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round"/>
      <text x="640.0" y="510" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" fill="#64748B">reuse</text>
    </g>

    <g>
      <path d="M960 632 V590" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 4"/>
      <path d="M955 597 L960 590 L965 597" fill="none" stroke="#34D399" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round"/>
      <circle class="flow" cx="0" cy="0" r="3" fill="#34D399" opacity="0" style="offset-path:path('M960 632 V590');offset-rotate:0deg;animation-delay:1.2s"/>
      <text x="972" y="615.0" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" fill="#64748B">MAC keys</text>
    </g>

    <text x="40" y="624" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="3" fill="#64748B">KEY MATERIAL</text>
    <g>
      <rect x="40" y="636" width="1200" height="52" rx="13" fill="#0B1526" fill-opacity="0.72" stroke="#34D399" stroke-opacity="0.45" stroke-width="1.3"/>
      <rect x="40" y="636" width="1200" height="4" rx="2" fill="#34D399"/>
      <text x="58" y="662" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.8" fill="#34D399">PROJECT 03</text>
      <text x="58" y="682" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">ECU Key Lifecycle Manager</text>

    </g>
    <text x="404" y="682" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#94A3B8">generation · HKDF derivation · provisioning ceremony · rotation with overlap · signed revocation · hash-chained audit</text>
  </g>
  <rect x="1" y="1" width="1278" height="698" rx="21" fill="none" stroke="url(#mEdge)" stroke-width="1.6"/>
</svg>
