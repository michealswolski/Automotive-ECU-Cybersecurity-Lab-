<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-label="Automotive ECU Cybersecurity Lab — six buildable automotive product-security projects.">
  <title>Automotive ECU Cybersecurity Lab</title>
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="52%" stop-color="#F1F5F9"/><stop offset="100%" stop-color="#E2E8F0"/></linearGradient>
    <linearGradient id="hTitle" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#06B6D4"/><stop offset="48%" stop-color="#2563EB"/><stop offset="100%" stop-color="#059669"/><animate attributeName="x1" values="-40%;60%;-40%" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="60%;160%;60%" dur="9s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="hEdge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0891B2" stop-opacity="0.55"/><stop offset="50%" stop-color="#2563EB" stop-opacity="0.45"/><stop offset="100%" stop-color="#059669" stop-opacity="0.8"/></linearGradient>
    <linearGradient id="hRule" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0891B2"/><stop offset="100%" stop-color="#059669" stop-opacity="0"/></linearGradient>
    <linearGradient id="hScan" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/><stop offset="50%" stop-color="#06B6D4" stop-opacity="0.40"/><stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/></linearGradient>
    <radialGradient id="hOrbC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0891B2" stop-opacity="0.50"/><stop offset="100%" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
    <radialGradient id="hOrbG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#059669" stop-opacity="0.50"/><stop offset="100%" stop-color="#059669" stop-opacity="0"/></radialGradient>
    <radialGradient id="hOrbB" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2563EB" stop-opacity="0.50"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <pattern id="hGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#2563EB" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <filter id="hGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="hCard"><rect width="400" height="440" rx="18"/></clipPath>
  </defs>
  <style>
    .fade{animation:fadeIn .7s ease-out backwards}
    .type{animation:type 1.45s steps(28,end) .35s backwards}
    .wipe{animation:wipe .95s cubic-bezier(.16,.9,.24,1) 1.9s backwards}
    .wipe2{animation:wipe .95s cubic-bezier(.16,.9,.24,1) 2.15s backwards}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow .8s cubic-bezier(.16,.9,.24,1) 2.7s backwards}
    .drift-a{animation:driftA 13s ease-in-out infinite}
    .drift-b{animation:driftB 17s ease-in-out infinite}
    .drift-c{animation:driftC 11s ease-in-out infinite}
    .grid-pan{animation:gridPan 22s linear infinite}
    .scan{animation:scan 7.5s cubic-bezier(.5,0,.5,1) infinite}
    .caret{animation:blink 1.06s steps(1,end) 1.8s infinite}
    .role{animation:role 17.6s linear infinite}
    .beat{animation:beat 2.6s ease-in-out infinite}
    .live{animation:live 2.2s ease-in-out infinite}
    .wave{animation:wave 5.5s linear infinite}
    .climb{animation:climb 4.4s cubic-bezier(.5,0,.5,1) infinite}
    .reject{animation:reject 4.4s ease-in-out infinite}
    @keyframes fadeIn{from{opacity:0}}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-20px)}}
    @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,18px)}}
    @keyframes driftC{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,24px)}}
    @keyframes gridPan{to{transform:translate(-40px,-40px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes role{0%,1%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
    @keyframes beat{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes live{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes wave{to{transform:translateX(-216px)}}
    @keyframes scan{{0%{{transform:translateY(-80px);opacity:1}}100%{{transform:translateY(520px);opacity:1}}}}
    @keyframes climb{{0%{{opacity:0}}100%{{opacity:0}}}}
    @keyframes reject{{0%,100%{{opacity:0}}}}
    @media (prefers-reduced-motion: reduce){
      .fade,.type,.wipe,.wipe2,.grow,.drift-a,.drift-b,.drift-c,.grid-pan,.scan,.caret,.role,.beat,.live,.wave,.climb,.reject,.flow,.pulse,.tick{animation:none}
    }
  </style>
  <g clip-path="url(#hCard)">
    <rect width="400" height="440" fill="url(#hBg)"/>
    <g class="grid-pan"><rect x="-40" y="-40" width="480" height="520" fill="url(#hGrid)"/></g>
    <g filter="url(#hBlur)">
      <circle class="drift-a" cx="60" cy="70" r="110" fill="url(#hOrbC)"/>
      <circle class="drift-b" cx="350" cy="360" r="120" fill="url(#hOrbG)"/>
    </g>
    <rect class="scan" x="0" y="0" width="400" height="70" fill="url(#hScan)" opacity="0"/>

    <g transform="translate(30,44)" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace">
      <rect x="-14" y="-24" width="368" height="32" rx="9" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="1" cy="-8" r="3.8" fill="#FF5F57"/>
      <circle cx="14" cy="-8" r="3.8" fill="#FEBC2E"/>
      <circle cx="27" cy="-8" r="3.8" fill="#28C840"/>
      <text x="44" y="-4" font-size="11.5" fill="#475569">micheal@ecu-lab</text>
      <text x="-2" y="32" font-size="13" fill="#059669">$</text>
      <g class="type"><text x="12" y="32" font-size="13" fill="#0F172A">make demo</text></g>
    </g>

    <g class="wipe" transform="translate(16,120)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.4" fill="url(#hTitle)" filter="url(#hGlow)">AUTOMOTIVE ECU</text>
    </g>
    <g class="wipe2" transform="translate(16,155)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.4" fill="url(#hTitle)" filter="url(#hGlow)">CYBERSECURITY LAB</text>
    </g>
    <rect class="grow" x="16" y="168" width="190" height="3.5" rx="2" fill="url(#hRule)"/>

    <g class="fade" style="animation-delay:2.0s">
      <rect x="16" y="186" width="368" height="50" rx="10" fill="#FFFFFF" fill-opacity="0.88" stroke="#0891B2" stroke-opacity="0.28" stroke-width="1"/>
      <text x="32" y="208" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0F172A">Six buildable projects across the automotive</text>
      <text x="32" y="226" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0F172A">product-security lifecycle.</text>
    </g>

      <g class="fade" style="animation-delay:2.4s">
        <rect x="16" y="250" width="108.7" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="31" cy="265" r="3" fill="#0891B2"/>
        <text x="42" y="270" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Secure Boot</text>
      </g>
      <g class="fade" style="animation-delay:2.49s">
        <rect x="132.7" y="250" width="65.8" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="147.7" cy="265" r="3" fill="#059669"/>
        <text x="158.7" y="270" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">SecOC</text>
      </g>
      <g class="fade" style="animation-delay:2.58s">
        <rect x="206.5" y="250" width="123.0" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="221.5" cy="265" r="3" fill="#2563EB"/>
        <text x="232.5" y="270" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Key Lifecycle</text>
      </g>
      <g class="fade" style="animation-delay:2.58s">
        <rect x="16" y="288" width="115.9" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="31" cy="303" r="3" fill="#0891B2"/>
        <text x="42" y="308" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">TARA / 21434</text>
      </g>
      <g class="fade" style="animation-delay:2.67s">
        <rect x="139.9" y="288" width="108.7" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="154.9" cy="303" r="3" fill="#059669"/>
        <text x="165.9" y="308" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">IVN Gateway</text>
      </g>
      <g class="fade" style="animation-delay:2.76s">
        <rect x="16" y="326" width="165.9" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="31" cy="341" r="3" fill="#2563EB"/>
        <text x="42" y="346" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Firmware Validation</text>
      </g>

    <g class="fade" style="animation-delay:3.0s">
      <rect x="16" y="366" width="368" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
      <circle class="live" cx="34" cy="388" r="4" fill="#059669"/>
      <text x="46" y="392" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.2" fill="#059669">6 PROJECTS</text>
      <line x1="142" y1="378" x2="142" y2="398" stroke="#CBD5E1" stroke-width="1"/>
      <text x="154" y="392" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#475569">56 phases</text>
      <line x1="240" y1="378" x2="240" y2="398" stroke="#CBD5E1" stroke-width="1"/>
      <text x="252" y="392" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#475569">114 criteria</text>
      <text x="34" y="411" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#B45309">simulation-based — stated up front</text>
    </g>
  </g>
  <rect x="1" y="1" width="398" height="438" rx="17" fill="none" stroke="url(#hEdge)" stroke-width="1.4"/>
</svg>
