<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-label="Automotive ECU Cybersecurity Lab — six buildable automotive product-security projects.">
  <title>Automotive ECU Cybersecurity Lab</title>
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="52%" stop-color="#F1F5F9"/><stop offset="100%" stop-color="#E2E8F0"/></linearGradient>
    <linearGradient id="hTitle" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#06B6D4"/><stop offset="48%" stop-color="#2563EB"/><stop offset="100%" stop-color="#059669"/><animate attributeName="x1" values="-40%;60%;-40%" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="60%;160%;60%" dur="9s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="hEdge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0891B2" stop-opacity="0.55"/><stop offset="50%" stop-color="#2563EB" stop-opacity="0.45"/><stop offset="100%" stop-color="#059669" stop-opacity="0.8"/></linearGradient>
    <linearGradient id="hRule" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0891B2"/><stop offset="100%" stop-color="#059669" stop-opacity="0"/></linearGradient>
    <linearGradient id="hScan" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/><stop offset="50%" stop-color="#06B6D4" stop-opacity="0.40"/><stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/></linearGradient>
    <radialGradient id="hOrbC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0891B2" stop-opacity="0.50"/><stop offset="100%" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
    <radialGradient id="hOrbG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#059669" stop-opacity="0.50"/><stop offset="100%" stop-color="#059669" stop-opacity="0"/></radialGradient>
    <radialGradient id="hOrbB" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2563EB" stop-opacity="0.50"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <pattern id="hGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#2563EB" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <filter id="hGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="hCard"><rect width="760" height="470" rx="20"/></clipPath>
    <clipPath id="hWaveClip"><rect x="0" y="0" width="216" height="30"/></clipPath>
  </defs>
  <style>
    .fade{animation:fadeIn .7s ease-out backwards}
    .type{animation:type 1.45s steps(28,end) .35s backwards}
    .wipe{animation:wipe .95s cubic-bezier(.16,.9,.24,1) 1.9s backwards}
    .wipe2{animation:wipe .95s cubic-bezier(.16,.9,.24,1) 2.15s backwards}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow .8s cubic-bezier(.16,.9,.24,1) 2.7s backwards}
    .drift-a{animation:driftA 13s ease-in-out infinite}
    .drift-b{animation:driftB 17s ease-in-out infinite}
    .drift-c{animation:driftC 11s ease-in-out infinite}
    .grid-pan{animation:gridPan 22s linear infinite}
    .scan{animation:scan 7.5s cubic-bezier(.5,0,.5,1) infinite}
    .caret{animation:blink 1.06s steps(1,end) 1.8s infinite}
    .role{animation:role 17.6s linear infinite}
    .beat{animation:beat 2.6s ease-in-out infinite}
    .live{animation:live 2.2s ease-in-out infinite}
    .wave{animation:wave 5.5s linear infinite}
    .climb{animation:climb 4.4s cubic-bezier(.5,0,.5,1) infinite}
    .reject{animation:reject 4.4s ease-in-out infinite}
    @keyframes fadeIn{from{opacity:0}}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-20px)}}
    @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,18px)}}
    @keyframes driftC{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,24px)}}
    @keyframes gridPan{to{transform:translate(-40px,-40px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes role{0%,1%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
    @keyframes beat{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes live{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes wave{to{transform:translateX(-216px)}}
    @keyframes scan{0%{transform:translateY(-90px);opacity:1}100%{transform:translateY(560px);opacity:1}}
    @keyframes climb{0%{opacity:0}100%{opacity:0}}
    @keyframes reject{0%,58%{opacity:0}66%,92%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){
      .fade,.type,.wipe,.wipe2,.grow,.drift-a,.drift-b,.drift-c,.grid-pan,.scan,.caret,.role,.beat,.live,.wave,.climb,.reject,.flow,.pulse,.tick{animation:none}
    }
  </style>
  <g clip-path="url(#hCard)">
    <rect width="760" height="470" fill="url(#hBg)"/>
    <g class="grid-pan"><rect x="-40" y="-40" width="840" height="550" fill="url(#hGrid)"/></g>
    <g filter="url(#hBlur)">
      <circle class="drift-a" cx="90" cy="100" r="130" fill="url(#hOrbC)"/>
      <circle class="drift-b" cx="660" cy="380" r="140" fill="url(#hOrbG)"/>
    </g>
    <rect class="scan" x="0" y="0" width="760" height="80" fill="url(#hScan)" opacity="0"/>

      <g transform="translate(32,46)" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace">
        <rect x="-14" y="-24" width="360" height="34" rx="9" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="2" cy="-7" r="4.1" fill="#FF5F57"/>
        <circle cx="17" cy="-7" r="4.1" fill="#FEBC2E"/>
        <circle cx="32" cy="-7" r="4.1" fill="#28C840"/>
        <text x="52" y="-3" font-size="12.5" fill="#475569">micheal@ecu-lab</text>
        <text x="0" y="34" font-size="14.5" fill="#059669">$</text>
        <g class="type">
          <text x="14" y="34" font-size="14.5" fill="#0F172A">make demo</text>
        </g>
        <rect class="caret" x="96.3" y="21" width="8.5" height="17" fill="#0891B2" opacity="0"/>
      </g>

    <g class="wipe" transform="translate(32,132)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.4" fill="url(#hTitle)" filter="url(#hGlow)">AUTOMOTIVE ECU</text>
    </g>
    <g class="wipe2" transform="translate(32,176)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.4" fill="url(#hTitle)" filter="url(#hGlow)">CYBERSECURITY LAB</text>
    </g>
    <rect class="grow" x="32" y="192" width="240" height="4" rx="2" fill="url(#hRule)"/>

    <g class="fade" style="animation-delay:2.2s">
      <rect x="32" y="220" width="696" height="62" rx="11" fill="#FFFFFF" fill-opacity="0.88" stroke="#0891B2" stroke-opacity="0.28" stroke-width="1"/>
      <text x="52" y="245" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#0F172A">Six buildable projects across the automotive</text>
      <text x="52" y="266" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#0F172A">product-security lifecycle.</text>
    </g>

      <g class="fade" style="animation-delay:2.6s">
        <rect x="32" y="300" width="108.7" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="47" cy="315" r="3" fill="#0891B2"/>
        <text x="58" y="320" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Secure Boot</text>
      </g>
      <g class="fade" style="animation-delay:2.69s">
        <rect x="148.7" y="300" width="65.8" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="163.7" cy="315" r="3" fill="#059669"/>
        <text x="174.7" y="320" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">SecOC</text>
      </g>
      <g class="fade" style="animation-delay:2.78s">
        <rect x="222.5" y="300" width="123.0" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="237.5" cy="315" r="3" fill="#2563EB"/>
        <text x="248.5" y="320" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Key Lifecycle</text>
      </g>
      <g class="fade" style="animation-delay:2.8s">
        <rect x="32" y="338" width="115.9" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="47" cy="353" r="3" fill="#0891B2"/>
        <text x="58" y="358" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">TARA / 21434</text>
      </g>
      <g class="fade" style="animation-delay:2.89s">
        <rect x="155.9" y="338" width="108.7" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="170.9" cy="353" r="3" fill="#059669"/>
        <text x="181.9" y="358" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">IVN Gateway</text>
      </g>
      <g class="fade" style="animation-delay:3.0s">
        <rect x="32" y="376" width="165.9" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
        <circle cx="47" cy="391" r="3" fill="#2563EB"/>
        <text x="58" y="396" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Firmware Validation</text>
      </g>

    <g class="fade" style="animation-delay:3.1s">
      <rect x="24" y="412" width="712" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
      <circle class="live" cx="48" cy="433" r="4.2" fill="#059669"/>
      <text x="62" y="438" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" letter-spacing="1.4" fill="#059669">6 PROJECTS</text>
      <line x1="164" y1="422" x2="164" y2="444" stroke="#CBD5E1" stroke-width="1"/>
      <text x="180" y="438" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#475569">56 phases</text>
      <line x1="286" y1="422" x2="286" y2="444" stroke="#CBD5E1" stroke-width="1"/>
      <text x="302" y="438" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#B45309">simulation-based</text>
        <g transform="translate(496,422)">
          <g clip-path="url(#hWaveClip)">
            <g class="wave">
              <path d="M0 22 h12 V8 h16 V22 h10 V8 h8 V22 h20 V8 h12 V22 h14 V8 h18 V22 h10 V8 h14 V22 h16 V8 h10 V22 h16 V8 h12 V22 h8" fill="none" stroke="#0891B2" stroke-opacity="0.85" stroke-width="1.6"/>
              <g transform="translate(216,0)"><path d="M0 22 h12 V8 h16 V22 h10 V8 h8 V22 h20 V8 h12 V22 h14 V8 h18 V22 h10 V8 h14 V22 h16 V8 h10 V22 h16 V8 h12 V22 h8" fill="none" stroke="#0891B2" stroke-opacity="0.85" stroke-width="1.6"/></g>
            </g>
          </g>
          <text x="216" y="2" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="9" letter-spacing="2" fill="#64748B">CAN-FD</text>
        </g>
    </g>
  </g>
  <rect x="1" y="1" width="758" height="468" rx="19" fill="none" stroke="url(#hEdge)" stroke-width="1.6"/>
</svg>
