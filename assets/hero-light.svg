      <text x="76" y="295" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0F172A">Six buildable projects across the automotive product-security lifecycle — spec, plan, and definition of done for each.</text>
    </g>

      <g class="fade" style="animation-delay:3.5s">
