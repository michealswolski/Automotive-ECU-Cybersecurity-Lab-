    </g>
    <g class="wipe2" transform="translate(56,196)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5" fill="url(#hTitle)" filter="url(#hGlow)">CYBERSECURITY LAB</text>
    </g>
    <rect class="grow" x="56" y="214" width="320" height="4" rx="2" fill="url(#hRule)"/>

    <g transform="translate(58,248)" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#475569">
        <text class="role" x="0" y="0" opacity="1" style="animation-delay:3.2s"><tspan fill="#0891B2">&gt;</tspan> Secure boot  ·  chain of trust, rollback protection, measured boot</text>
        <text class="role" x="0" y="0" opacity="0" style="animation-delay:7.6s"><tspan fill="#0891B2">&gt;</tspan> AUTOSAR SecOC  ·  CMAC, freshness, replay that actually replays</text>
        <text class="role" x="0" y="0" opacity="0" style="animation-delay:12.0s"><tspan fill="#0891B2">&gt;</tspan> ISO/SAE 21434  ·  TARA with traceability you can query</text>
        <text class="role" x="0" y="0" opacity="0" style="animation-delay:16.4s"><tspan fill="#0891B2">&gt;</tspan> Key lifecycle  ·  generation to destruction, audited end to end</text>
    </g>

    <g class="fade" style="animation-delay:3.0s">
