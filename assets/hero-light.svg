<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Automotive ECU Cybersecurity Lab — six buildable projects covering secure boot, AUTOSAR SecOC, ECU key lifecycle, ISO/SAE 21434 TARA, in-vehicle network defence, and firmware security validation.">
  <title>Automotive ECU Cybersecurity Lab</title>
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="52%" stop-color="#F1F5F9"/><stop offset="100%" stop-color="#E2E8F0"/></linearGradient>
    <linearGradient id="hTitle" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#06B6D4"/><stop offset="48%" stop-color="#2563EB"/><stop offset="100%" stop-color="#059669"/><animate attributeName="x1" values="-40%;60%;-40%" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="60%;160%;60%" dur="9s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="hEdge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0891B2" stop-opacity="0.55"/><stop offset="50%" stop-color="#2563EB" stop-opacity="0.45"/><stop offset="100%" stop-color="#059669" stop-opacity="0.8"/></linearGradient>
    <linearGradient id="hRule" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0891B2"/><stop offset="100%" stop-color="#059669" stop-opacity="0"/></linearGradient>
    <linearGradient id="hScan" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/><stop offset="50%" stop-color="#06B6D4" stop-opacity="0.40"/><stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/></linearGradient>
    <radialGradient id="hOrbC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0891B2" stop-opacity="0.50"/><stop offset="100%" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
    <radialGradient id="hOrbG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#059669" stop-opacity="0.50"/><stop offset="100%" stop-color="#059669" stop-opacity="0"/></radialGradient>
    <radialGradient id="hOrbB" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2563EB" stop-opacity="0.50"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <pattern id="hGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#2563EB" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <filter id="hGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="hCard"><rect width="1280" height="440" rx="24"/></clipPath>
    <clipPath id="hWaveClip"><rect x="0" y="0" width="216" height="30"/></clipPath>
  </defs>
  <style>
    .fade{animation:fadeIn .7s ease-out backwards}
    .type{animation:type 1.45s steps(28,end) .35s backwards}
    .wipe{animation:wipe .95s cubic-bezier(.16,.9,.24,1) 1.9s backwards}
    .wipe2{animation:wipe .95s cubic-bezier(.16,.9,.24,1) 2.15s backwards}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow .8s cubic-bezier(.16,.9,.24,1) 2.7s backwards}
    .drift-a{animation:driftA 13s ease-in-out infinite}
    .drift-b{animation:driftB 17s ease-in-out infinite}
    .drift-c{animation:driftC 11s ease-in-out infinite}
    .grid-pan{animation:gridPan 22s linear infinite}
    .scan{animation:scan 7.5s cubic-bezier(.5,0,.5,1) infinite}
    .caret{animation:blink 1.06s steps(1,end) 1.8s infinite}
    .role{animation:role 17.6s linear infinite}
    .beat{animation:beat 2.6s ease-in-out infinite}
    .live{animation:live 2.2s ease-in-out infinite}
    .wave{animation:wave 5.5s linear infinite}
    .climb{animation:climb 4.4s cubic-bezier(.5,0,.5,1) infinite}
    .reject{animation:reject 4.4s ease-in-out infinite}
    @keyframes fadeIn{from{opacity:0}}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-20px)}}
    @keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,18px)}}
    @keyframes driftC{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,24px)}}
    @keyframes gridPan{to{transform:translate(-40px,-40px)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes role{0%,1%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
    @keyframes beat{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes live{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes wave{to{transform:translateX(-216px)}}
    @keyframes scan{0%{transform:translateY(-90px);opacity:1}100%{transform:translateY(530px);opacity:1}}
    @keyframes climb{0%{opacity:0;transform:translateY(0)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(-148px)}}
    @keyframes reject{0%,58%{opacity:0}66%,92%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){
      .fade,.type,.wipe,.wipe2,.grow,.drift-a,.drift-b,.drift-c,.grid-pan,.scan,.caret,.role,.beat,.live,.wave,.climb,.reject,.flow,.pulse,.tick{animation:none}
    }
  </style>
  <g clip-path="url(#hCard)">
    <rect width="1280" height="440" fill="url(#hBg)"/>
    <g class="grid-pan"><rect x="-40" y="-40" width="1360" height="520" fill="url(#hGrid)"/></g>
    <g filter="url(#hBlur)">
      <circle class="drift-a" cx="150" cy="120" r="150" fill="url(#hOrbC)"/>
      <circle class="drift-b" cx="1080" cy="330" r="170" fill="url(#hOrbG)"/>
      <circle class="drift-c" cx="640" cy="60" r="140" fill="url(#hOrbB)"/>
    </g>
    <rect class="scan" x="0" y="0" width="1280" height="90" fill="url(#hScan)" opacity="0"/>

      <g transform="translate(56,52)" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace">
        <rect x="-14" y="-24" width="392" height="34" rx="9" fill="#FFFFFF" fill-opacity="0.88" stroke="#CBD5E1" stroke-width="1"/>
