        <g class="type">
          <text x="14" y="34" font-size="14.5" fill="#0F172A">make demo PROJECT=secure-boot</text>
        </g>
        <rect class="caret" x="270.3" y="21" width="8.5" height="17" fill="#0891B2" opacity="0"/>
      </g>

